<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="murmur-gold" x1="12%" y1="5%" x2="88%" y2="95%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="cute-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#d97706" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#cute-glow)">
    <!-- Puffed Rice Body with Speech Bubble Pointer -->
    <path
      d="M23 42 C18.8 45.2 13.8 46.5 10 46.8 C12.5 43.2 13.8 39.5 14 35.8 C8.8 29.2 9.5 17.5 18 9.8 C26.2 2.2 37 3.8 41.2 12 C45.2 20.2 43.2 31.5 35.2 37.8 C30.5 41.5 26.5 42 23 42 Z"
      fill="url(#murmur-gold)"
    />

    <!-- Murmura Top Crease -->
    <path
      d="M24 7 C26.5 10.5 25.5 14 24 16"
      stroke="#b45309"
      stroke-width="1.5"
      stroke-linecap="round"
      opacity="0.5"
    />

    <!-- Murmura Highlight Arc -->
    <path
      d="M20 9.5 C25 6 34 7 38 13"
      stroke="#ffffff"
      stroke-width="1.6"
      stroke-linecap="round"
      opacity="0.5"
    />

    <!-- Rosy Blush Cheeks -->
    <ellipse cx="17.5" cy="25" rx="2.4" ry="1.5" fill="#fb7185" opacity="0.65" transform="rotate(-8 17.5 25)" />
    <ellipse cx="37" cy="26.5" rx="2.4" ry="1.5" fill="#fb7185" opacity="0.65" transform="rotate(-8 37 26.5)" />

    <!-- Left Eye (Glossy with Sparkle) -->
    <circle cx="22" cy="21.5" r="2.6" fill="#1c1917" />
    <circle cx="22.8" cy="20.7" r="0.9" fill="#ffffff" />
    <circle cx="21.3" cy="22.4" r="0.45" fill="#ffffff" />

    <!-- Right Eye (Glossy with Sparkle) -->
    <circle cx="33" cy="23" r="2.6" fill="#1c1917" />
    <circle cx="33.8" cy="22.2" r="0.9" fill="#ffffff" />
    <circle cx="32.3" cy="23.9" r="0.45" fill="#ffffff" />

    <!-- Cute Cheerful Open Smile with Tongue -->
    <path
      d="M25.5 27 C25.5 30.2 29.8 30.8 30.2 27.5 Z"
      fill="#1c1917"
    />
    <path
      d="M26.8 28.5 C27.5 29.8 28.8 29.8 29.6 28.5 Z"
      fill="#fb7185"
    />
  </g>
</svg>

